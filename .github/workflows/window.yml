name: Look outside

on:
  schedule:
    - cron: "7 * * * *" # every hour, a few minutes past
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: window
  cancel-in-progress: true

jobs:
  redraw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Redraw the window
        run: node scripts/window.mjs

      # The pictures live on their own branch as one commit that is replaced
      # every hour, so main only ever has commits a person made.
      - name: Hang it on the window branch
        working-directory: window
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init -q -b window
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Look outside"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" window
