name: Look outside

on:
  schedule:
    - cron: "7 * * * *" # every hour, a few minutes past
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: window
  cancel-in-progress: true

jobs:
  redraw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Redraw the window
        run: node scripts/window.mjs

      - name: Commit if the sky changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add window
          git diff --cached --quiet && exit 0
          git commit -m "Look outside"
          git push
